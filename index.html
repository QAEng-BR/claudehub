<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0;url=https://couplefinances1.netlify.app">
  <script>location.replace('https://couplefinances1.netlify.app');</script>
  <title>Claude Hub — Brahian's App Library</title>
  <script src="data.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #f1f5f9;
      --surface:      #ffffff;
      --border:       #e2e8f0;
      --text:         #1e293b;
      --muted:        #64748b;
      --primary:      #3b82f6;
      --primary-dk:   #1d4ed8;
      --success:      #10b981;
      --warning:      #f59e0b;
      --danger:       #ef4444;
      --header-bg:    #0f172a;
      --header-text:  #f8fafc;
      --radius:       12px;
      --shadow:       0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
      --shadow-md:    0 4px 12px rgba(0,0,0,.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 15px;
    }

    /* ── HEADER ────────────────────────────────────────────────────────────── */
    header {
      background: var(--header-bg);
      padding: 0 32px;
      display: flex;
      align-items: center;
      gap: 32px;
      height: 62px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--header-text);
      font-weight: 700;
      font-size: 17px;
      letter-spacing: -.2px;
      text-decoration: none;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: var(--primary);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 16px;
    }
    nav { display: flex; gap: 4px; margin-left: auto; }
    .nav-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all .15s;
    }
    .nav-btn:hover  { background: rgba(255,255,255,.08); color: #fff; }
    .nav-btn.active { background: rgba(59,130,246,.25); color: var(--primary); }
    .header-meta { color: #475569; font-size: 13px; }

    /* ── MAIN ──────────────────────────────────────────────────────────────── */
    main { max-width: 1100px; margin: 0 auto; padding: 36px 24px 60px; }

    /* ── TABS ──────────────────────────────────────────────────────────────── */
    .tab { display: none; }
    .tab.active { display: block; }

    /* ── SECTION HEADER ────────────────────────────────────────────────────── */
    .section-head {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 22px;
    }
    .section-title { font-size: 22px; font-weight: 700; }
    .section-count {
      background: var(--primary);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 99px;
    }

    /* ── SESSION CARDS ─────────────────────────────────────────────────────── */
    .sessions-grid { display: grid; gap: 18px; }
    .session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      box-shadow: var(--shadow);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      transition: box-shadow .2s, transform .2s;
      text-decoration: none;
      color: inherit;
    }
    .session-card:hover {
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }
    .session-date {
      font-size: 12px;
      font-weight: 600;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: .6px;
      margin-bottom: 6px;
    }
    .session-title { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
    .session-summary { color: var(--muted); font-size: 14px; line-height: 1.55; margin-bottom: 12px; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      background: #eff6ff;
      color: var(--primary-dk);
      border: 1px solid #bfdbfe;
      font-size: 12px;
      font-weight: 500;
      padding: 2px 10px;
      border-radius: 99px;
    }
    .session-stats {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
      min-width: 90px;
    }
    .stat-pill {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .stat-pill b { color: var(--text); }
    .view-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-top: auto;
    }

    /* ── APP CARDS ─────────────────────────────────────────────────────────── */
    .apps-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: box-shadow .2s, transform .2s;
    }
    .app-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
    .app-icon-wrap {
      width: 52px; height: 52px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 26px;
    }
    .app-name { font-size: 17px; font-weight: 700; }
    .app-desc { color: var(--muted); font-size: 13.5px; line-height: 1.5; flex: 1; }
    .app-meta { font-size: 12px; color: var(--muted); }
    .app-launch {
      display: inline-block;
      padding: 9px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      color: #fff;
      text-align: center;
    }
    .status-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--success);
      margin-right: 5px;
    }

    /* ── COMMANDS TABLE ────────────────────────────────────────────────────── */
    .cmd-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: #f8fafc; }
    th {
      text-align: left;
      padding: 12px 18px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 14px 18px;
      font-size: 14px;
      border-bottom: 1px solid var(--border);
      vertical-align: top;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }
    .cmd-name {
      font-family: "SF Mono", "Fira Code", monospace;
      font-weight: 700;
      color: var(--primary-dk);
      background: #eff6ff;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }
    .cmd-file {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      color: var(--muted);
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .cmd-notes { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .cmd-date { font-size: 12px; color: var(--muted); white-space: nowrap; }

    /* ── EMPTY STATE ───────────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }

    /* ── HERO ──────────────────────────────────────────────────────────────── */
    .hero {
      background: linear-gradient(135deg, #1e3a5f 0%, #0f172a 100%);
      border-radius: var(--radius);
      padding: 36px 40px;
      color: #fff;
      margin-bottom: 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }
    .hero h1 { font-size: 26px; font-weight: 800; margin-bottom: 6px; }
    .hero p { color: #94a3b8; font-size: 14px; line-height: 1.6; max-width: 480px; }
    .hero-stats { display: flex; gap: 28px; }
    .hero-stat { text-align: center; }
    .hero-stat-num { font-size: 32px; font-weight: 800; color: var(--primary); }
    .hero-stat-lbl { font-size: 12px; color: #64748b; margin-top: 2px; }
  </style>
</head>
<body>

<header>
  <a class="logo" href="#">
    <span class="logo-icon">🤖</span>
    Claude Hub
  </a>
  <nav>
    <button class="nav-btn active" onclick="showTab('sessions', this)">📅 Sessions</button>
    <button class="nav-btn"        onclick="showTab('apps',     this)">🚀 Apps</button>
    <button class="nav-btn"        onclick="showTab('commands', this)">⌨️ Commands</button>
  </nav>
  <span class="header-meta" id="header-meta"></span>
</header>

<main>

  <!-- HERO -->
  <div class="hero">
    <div>
      <h1>Brahian's App Library</h1>
      <p>Every session with Claude is documented here — findings, apps built, and terminal tools created. Use the tabs above to browse by date, launch apps, or look up commands.</p>
    </div>
    <div class="hero-stats" id="hero-stats"></div>
  </div>

  <!-- SESSIONS TAB -->
  <div class="tab active" id="tab-sessions">
    <div class="section-head">
      <span class="section-title">Sessions</span>
      <span class="section-count" id="sessions-count">0</span>
    </div>
    <div class="sessions-grid" id="sessions-grid"></div>
  </div>

  <!-- APPS TAB -->
  <div class="tab" id="tab-apps">
    <div class="section-head">
      <span class="section-title">Apps</span>
      <span class="section-count" id="apps-count">0</span>
    </div>
    <div class="apps-grid" id="apps-grid"></div>
  </div>

  <!-- COMMANDS TAB -->
  <div class="tab" id="tab-commands">
    <div class="section-head">
      <span class="section-title">Terminal Commands & Functions</span>
      <span class="section-count" id="cmds-count">0</span>
    </div>
    <div class="cmd-table-wrap">
      <table>
        <thead>
          <tr>
            <th>Command</th>
            <th>Description</th>
            <th>File</th>
            <th>Added</th>
          </tr>
        </thead>
        <tbody id="cmd-tbody"></tbody>
      </table>
    </div>
  </div>

</main>

<script>
  // ── Helpers ─────────────────────────────────────────────────────────────────
  function fmtDate(d) {
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', {
      year: 'numeric', month: 'long', day: 'numeric'
    });
  }

  function showTab(name, btn) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
  }

  // ── Render ───────────────────────────────────────────────────────────────────
  function render() {
    const { sessions, apps, commands, meta } = HUB;

    // Header meta
    document.getElementById('header-meta').textContent =
      `Last updated: ${fmtDate(meta.lastUpdated)}`;

    // Hero stats
    document.getElementById('hero-stats').innerHTML = `
      <div class="hero-stat">
        <div class="hero-stat-num">${sessions.length}</div>
        <div class="hero-stat-lbl">Sessions</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-num">${apps.length}</div>
        <div class="hero-stat-lbl">Apps</div>
      </div>
      <div class="hero-stat">
        <div class="hero-stat-num">${commands.length}</div>
        <div class="hero-stat-lbl">Commands</div>
      </div>`;

    // ── Sessions ────────────────────────────────────────────────────────────
    document.getElementById('sessions-count').textContent = sessions.length;
    const sg = document.getElementById('sessions-grid');
    sg.innerHTML = sessions.slice().reverse().map(s => `
      <a class="session-card" href="sessions/${s.id}.html">
        <div>
          <div class="session-date">${fmtDate(s.date)}</div>
          <div class="session-title">${s.title}</div>
          <div class="session-summary">${s.summary}</div>
          <div class="tags">${s.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
        <div class="session-stats">
          <div class="stat-pill"><b>${s.findings.length}</b> findings</div>
          <div class="stat-pill"><b>${s.actions.length}</b> actions</div>
          <div class="stat-pill"><b>${s.apps.length}</b> app${s.apps.length !== 1 ? 's' : ''}</div>
          <div class="stat-pill"><b>${s.commands.length}</b> cmd${s.commands.length !== 1 ? 's' : ''}</div>
          <span class="view-btn">View →</span>
        </div>
      </a>`).join('');

    // ── Apps ────────────────────────────────────────────────────────────────
    document.getElementById('apps-count').textContent = apps.length;
    const ag = document.getElementById('apps-grid');
    ag.innerHTML = apps.map(a => `
      <div class="app-card">
        <div class="app-icon-wrap" style="background:${a.colorLight}">
          ${a.icon}
        </div>
        <div>
          <div class="app-name">${a.name}</div>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">
            <span class="status-dot"></span>${a.status}
            &nbsp;·&nbsp; Added ${fmtDate(a.created)}
          </div>
        </div>
        <div class="app-desc">${a.description}</div>
        <div class="app-meta">Session: ${fmtDate(a.session)}</div>
        <a class="app-launch" href="${a.file}" style="background:${a.color}">
          Open ${a.name.split(' ')[0]} ${a.name.split(' ')[1]} →
        </a>
      </div>`).join('');

    if (!apps.length) {
      ag.innerHTML = `<div class="empty"><div class="empty-icon">🚧</div><p>No apps yet.</p></div>`;
    }

    // ── Commands ────────────────────────────────────────────────────────────
    document.getElementById('cmds-count').textContent = commands.length;
    const ct = document.getElementById('cmd-tbody');
    ct.innerHTML = commands.map(c => `
      <tr>
        <td><span class="cmd-name">${c.syntax}</span></td>
        <td>
          ${c.description}
          ${c.notes ? `<div class="cmd-notes">💡 ${c.notes}</div>` : ''}
        </td>
        <td><span class="cmd-file">${c.file}</span></td>
        <td class="cmd-date">${fmtDate(c.created)}</td>
      </tr>`).join('');
  }

  render();
</script>
</body>
</html>
